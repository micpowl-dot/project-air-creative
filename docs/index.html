:root{
  --bg:#030712;

  --surface-2:#111827;
  --surface-3:#1F2937;
  --surface-4:#374151;
  --text-1:#F9FAFB;
  --text-2:#F3F4F6;
  --text-3:#D1D5DB;

  --amber-bg:#422006;
  --amber-bd:#78350F;
  --amber-fg:#FDE68A;
  --purple-bg:#1E1B4B;
  --purple-bd:#312E81;
  --purple-fg:#C4B5FD;
  --red-soft-bg:#1A0606;
  --red-bd:#7F1D1D;
  --red-strong:#EF4444;
  --red-fg:#FCA5A5;
  --bar-design:linear-gradient(90deg,#6D28D9,#8B5CF6);
  --bar-prod:linear-gradient(90deg,#B45309,#F59E0B);
  --shadow-card:none;
}
:root.light{
  --bg:#FDFDFC;
  --surface-1:#FFFFFF;
  --surface-2:#F4F5F7;
  --surface-3:#D1D5DB;
  --surface-4:#9CA3AF;
  --text-1:#0F172A;
  --text-2:#1E293B;
  --text-3:#334155;
  --text-4:#475569;
  --text-5:#64748B;
  --text-6:#94A3B8;
  --code-bg:#E5E7EB;
  --amber-bg:#FEF3C7;
  --amber-bd:#FCD34D;
  --amber-fg:#92400E;
  --purple-bg:#EDE9FE;
  --purple-bd:#C4B5FD;
  --purple-fg:#5B21B6;

  --red-bd:#FCA5A5;

  --shadow-card:0 1px 2px rgba(15,23,42,.04),0 0 0 1px rgba(15,23,42,.04);

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text-1);font-family:'DM Sans',-apple-system,sans-serif;min-height:100vh;transition:background .2s ease,color .2s ease}
a{color:inherit;text-decoration:none}
button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
:root.light [style*="background:var(--surface-1);border:1px solid var(--surface-3)"],
:root.light [style*="background:var(--surface-2);border:1px solid var(--surface-3)"],
:root.light details,
:root.light .stat-clickable{box-shadow:0 1px 3px rgba(15,23,42,.07),0 0 0 1px rgba(15,23,42,.04)}
:root.light details{border-color:var(--surface-3)!important}
.pulse{animation:pulse 2s infinite}
.stat-clickable{cursor:pointer;transition:border-color .15s ease,background .15s ease}
.stat-clickable:hover{border-color:var(--text-6)!important;background:var(--surface-2)!important}
.row-grid{display:grid;grid-template-columns:minmax(220px,1.5fr) 2.4fr 1.1fr 1fr;gap:14px;align-items:center}
.gantt-row{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--surface-2)}
.gantt-row:last-child{border-bottom:0}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.task-row{display:grid;grid-template-columns:28px 56px 1.6fr 1.1fr 0.85fr 0.65fr;gap:10px;padding:8px 12px;border-radius:6px;align-items:center;font-size:12px}
.task-row:hover{background:var(--surface-1)}
.task-row.done{color:var(--text-6)}
.task-row.done .task-name{text-decoration:line-through}
.late-1{background:#2A0A0A!important;border-left:3px solid #B91C1C}
.late-2{background:#4A0F0F!important;border-left:3px solid #DC2626;color:#FECACA}
.late-3{background:#6E1212!important;border-left:3px solid #EF4444;color:#FEE2E2}
.late-4{background:#8F1A1A!important;border-left:3px solid #FB7185;color:#FFF1F2;animation:lateBlink 2.4s ease-in-out infinite}
.task-row.late-1,.task-row.late-2,.task-row.late-3,.task-row.late-4{padding-left:9px}
.task-row.late-1:hover{background:#3A1414!important}
.task-row.late-2:hover{background:#5A1818!important}
.task-row.late-3:hover{background:#7E1A1A!important}
.task-row.late-4:hover{background:#9F2424!important}
@keyframes lateBlink{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 12px 0 rgba(239,68,68,.45)}}
:root.light .late-1{background:#FEE2E2!important;color:var(--red-bd)}
:root.light .late-2{background:#FECACA!important;color:var(--red-bd)}
:root.light .late-3{background:#FCA5A5!important;color:var(--red-bd)}
:root.light .late-4{background:#F87171!important;color:#450A0A}
:root.light .late-1:hover{background:#FECACA!important}
:root.light .late-2:hover{background:#FCA5A5!important}
:root.light .late-3:hover{background:#F87171!important}
:root.light .late-4:hover{background:#EF4444!important}
.tbox{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.5px solid var(--text-6);border-radius:4px;background:var(--surface-1);transition:all .12s ease;position:relative}
.tbox:hover{border-color:var(--text-4);background:var(--surface-3)}
.tbox.checked{background:#10B981;border-color:#10B981}
.tbox.checked::after{content:"";position:absolute;top:2px;left:5px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tbox.override::before{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:#F59E0B;border:1px solid var(--bg)}
.chevron-indicator{display:inline-flex;transition:transform .2s ease;color:var(--text-4)}
details[open] > summary .chevron-indicator{transform:rotate(90deg)}
.maigh-input{background:var(--surface-2);border:1px solid var(--surface-3);color:var(--text-2);padding:3px 7px;border-radius:4px;font-size:11px;width:64px;font-family:inherit;transition:border-color .15s ease}
.maigh-input:focus{outline:none;border-color:#F59E0B;background:var(--surface-1)}
.maigh-input.has-value{border-color:#10B981;background:var(--surface-1)}
@media (max-width:900px){
  .row-grid{grid-template-columns:1fr;gap:6px}
  .gantt-row{grid-template-columns:1fr;gap:4px}
  .task-row{grid-template-columns:28px 50px 1fr;gap:6px}
  .task-row > *:nth-child(n+4){grid-column:3/4}
}
</style>

  applyOverlay();
  render();
};

window.jumpToTask = function(deliverable, taskId){
  const det = document.getElementById('d-' + deliverable);
  if (!det) return;
  det.open = true;
  requestAnimationFrame(() => {
    const target = taskId ? document.getElementById('task-' + taskId) : det;
    if (!target) return;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    if (taskId){
      target.style.transition = 'background .25s';
      const prev = target.style.background;
      target.style.background = '#1E3A5F';
      setTimeout(() => { target.style.background = prev; }, 1200);
    }
  });
};

const $ = s => document.getElementById(s);
const fmtDate = iso => {
  if (!iso) return "";
  const d = new Date(iso.length===10 ? iso+"T12:00:00" : iso);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
};
const dateMS = iso => new Date(iso.length===10 ? iso+"T23:59:59" : iso).getTime();
const daysLeft = () => Math.max(0, Math.ceil((EVENT_DATE - TODAY) / 86400000));
const US_HOLIDAYS = new Set(["2026-05-25"]); // Memorial Day
const workingDaysLeft = () => {
  let n = 0;
  const cur = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  cur.setDate(cur.getDate() + 1); // exclude today
  while (cur <= EVENT_DATE) {
    const dow = cur.getDay();
    const iso = cur.toISOString().slice(0,10);
    if (dow !== 0 && dow !== 6 && !US_HOLIDAYS.has(iso)) n++;
    cur.setDate(cur.getDate() + 1);
  }
  return n;
};
const isOverdue = (iso, status) => {
  if (!iso) return false;
  if (status === "complete" || status === "approved") return false;
  return TODAY.getTime() > dateMS(iso);
};
const daysLate = (iso, status) => {
  if (!isOverdue(iso, status)) return 0;
  return Math.max(0, Math.floor((TODAY.getTime() - dateMS(iso)) / 86400000));
};
const lateClass = days => days<=0 ? "" : days<=2 ? "late-1" : days<=5 ? "late-2" : days<=10 ? "late-3" : "late-4";
const member = n => TEAM.find(t => t.n === n);
const avatar = (name, size=22) => {
  const t = member(name);
  if (!t) return "";
  const op = t.dim ? .45 : 1;
  return `<span title="${t.n}${t.dim?' (paternity leave)':''}" style="display:inline-flex;width:${size}px;height:${size}px;border-radius:50%;background:${t.c};color:#fff;align-items:center;justify-content:center;font-size:${Math.round(size*.38)}px;font-weight:700;opacity:${op}">${t.i}</span>`;
};
const stack = (names, size=22) => {
  if (!names || !names.length) return `<span style="font-size:11px;color:var(--text-6)">—</span>`;
  const arr = Array.isArray(names) ? names : [names];
  return `<span style="display:inline-flex">${arr.map((n,i) =>
    `<span style="margin-left:${i?-6:0}px">${avatar(n,size)}</span>`).join("")}</span>`;
};
const statusPill = s => {
  const m = STATUS_META[s] || STATUS_META.not_started;
  return `<span style="display:inline-block;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700;background:${m.bg};color:${m.fg};text-transform:uppercase;letter-spacing:.04em">${m.label}</span>`;
};

// ---------- COMPUTED ----------
function summarize(){
  const total = TASK_STATE.length;
  const done = TASK_STATE.filter(t => t.status==="complete"||t.status==="approved").length;
  const inProgress = TASK_STATE.filter(t => t.status==="in_progress"||t.status==="in_review").length;
  const blocked = TASK_STATE.filter(t => t.status==="blocked").length;
  const overdue = TASK_STATE.filter(t => isOverdue(t.due,t.status)).length;
  return {total, done, inProgress, blocked, overdue};
}
function deliverableSummary(id){
  const tasks = TASK_STATE.filter(t => t.d === id);
  const done = tasks.filter(t => t.status==="complete"||t.status==="approved").length;
  const inProgress = tasks.filter(t => t.status==="in_progress"||t.status==="in_review").length;
  const overdue = tasks.filter(t => isOverdue(t.due,t.status)).length;
  return {tasks, total: tasks.length, done, inProgress, overdue, pct: tasks.length ? done/tasks.length*100 : 0};
}
function attentionItems(){
  const horizon = TODAY.getTime() + 7*86400000;
  return TASK_STATE
    .filter(t => t.status!=="complete" && t.status!=="approved")
    .filter(t => dateMS(t.due) <= horizon)
    .sort((a,b) => dateMS(a.due) - dateMS(b.due));
}

async function fetchLive(){
  try{
    const url = "https://raw.githubusercontent.com/micpowl-dot/project-air-creative/main/asset-tracker-status.json?t=" + Date.now();
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error("no-file");
    LIVE = await r.json();
    applyOverlay();
  } catch(e) {
    LIVE = null;
  }
  NEXT_REFRESH = new Date(Date.now() + 60000);
  render();
}
function applyOverlay(){
  TASK_STATE = TASKS.map(t => ({...t, owner: [...(t.owner||[])]}));
  const byId = Object.fromEntries(TASK_STATE.map(t => [t.id, t]));
  if (LIVE && LIVE.task_updates){
    LIVE.task_updates.forEach(u => {
      const id = u.task_id || u.id;
      if (id && byId[id]){
        if (u.new_status) byId[id].status = u.new_status;
        if (u.owner) byId[id].owner = Array.isArray(u.owner) ? u.owner : [u.owner];
        if (u.due) byId[id].due = u.due;
        if (u.note) byId[id].note = u.note;
      }
    });
  }
  Object.entries(OVERRIDES).forEach(([id, status]) => {
    if (byId[id]) byId[id].status = status;
  });
}
applyOverlay();

const MAIGH_DATA_KEY = "projectAirMaighData_v1";
let MAIGH_DATA = {};
try { MAIGH_DATA = JSON.parse(localStorage.getItem(MAIGH_DATA_KEY) || "{}"); } catch(e) { MAIGH_DATA = {}; }
function saveMaighData(){
  try { localStorage.setItem(MAIGH_DATA_KEY, JSON.stringify(MAIGH_DATA)); } catch(e) {}
}
window.updateMaighData = function(id, key, value){
  if (!MAIGH_DATA[id]) MAIGH_DATA[id] = {};
  if (value === "" || value == null) {
    delete MAIGH_DATA[id][key];
    if (Object.keys(MAIGH_DATA[id]).length === 0) delete MAIGH_DATA[id];
  } else {
    MAIGH_DATA[id][key] = value;
  }
  saveMaighData();
  render();
};
function maighValue(id, key){
  return MAIGH_DATA[id] && MAIGH_DATA[id][key] != null ? String(MAIGH_DATA[id][key]) : "";
}
function maighSizeSummary(){
  const d = MAIGH_DATA["MAIGH-03"] || {};
  const parts = [];
  ["s","m","l","xl","xxl"].forEach(k => {
    const v = d[k];
    if (v) parts.push(`${v}${k==="xxl"?"2XL":k.toUpperCase()}`);
  });
  return parts.length ? parts.join(" · ") : "";
}

window.toggleMaigh = function(id){
  const isDone = OVERRIDES[id] === "complete";
  if (isDone) {
    delete OVERRIDES[id];
  } else {
    OVERRIDES[id] = "complete";
  }
  saveOverrides();
  render();
  if (!isDone) showSheetPrompt(id);
};

function renderMaighRequests(){
  const dayMs = 86400000;
  const statusFor = item => {
    const dueMS = dateMS(item.due);
    const today = TODAY.getTime();
    if (today > dueMS) {
      const late = Math.floor((today - dueMS) / dayMs);
      return {label:`+${late}d LATE`, color:"var(--red-strong)", bg:"var(--red-soft-bg)", border:"var(--red-bd)"};
    }
    if (dueMS - today < dayMs) {
      return {label:"DUE TODAY", color:"#D97706", bg:"var(--amber-bg)", border:"#F59E0B"};
    }
    const daysOut = Math.ceil((dueMS - today) / dayMs);
    return {label:`DUE ${fmtDate(item.due)} · ${daysOut}d`, color:"var(--amber-fg)", bg:"var(--amber-bg)", border:"var(--amber-bd)"};
  };

  const isDone = id => OVERRIDES[id] === "complete";
  const doneCount = MAIGH_ITEMS.filter(i => isDone(i.id)).length;
  const overdueCount = MAIGH_ITEMS.filter(i => !isDone(i.id) && TODAY.getTime() > dateMS(i.due)).length;

  return `
  <section style="margin-top:24px">
    <details open style="background:var(--surface-1);border:1px solid var(--amber-bd);border-radius:12px">
      <summary style="padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-fg)">
        <span class="chevron-indicator">${ICONS.chevronRight}</span>
        <span style="display:inline-flex;color:var(--amber-fg)">${ICONS.mailForward}</span>
        <span>Awaiting from Maigh Houlihan · Program Lead</span>
        <span style="font-size:10px;color:var(--text-5);font-weight:600;letter-spacing:.04em;text-transform:none">${doneCount}/${MAIGH_ITEMS.length} received${overdueCount?` · ${overdueCount} overdue`:""}</span>
        <a href="${PROGRAM_SHEET_URL}" target="_blank" rel="noopener" title="Open program sheet" onclick="event.stopPropagation()" style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text-3);text-transform:none;letter-spacing:.02em;padding:4px 10px;border:1px solid var(--surface-3);border-radius:5px;background:var(--surface-2)">${ICONS.externalLink} Program sheet</a>
      </summary>
      <div style="padding:0 16px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px">
        ${MAIGH_ITEMS.map(item => {
          const done = isDone(item.id);
          const st = statusFor(item);
          const rowBg = done ? "var(--surface-2)" : st.bg;
          const rowBorder = done ? "#10B981" : st.border;
          const inputs = (item.inputs || []).map(input => {
            const val = maighValue(item.id, input.key);
            return `
              <label style="display:inline-flex;flex-direction:column;gap:2px;font-size:9px;color:var(--text-5);letter-spacing:.04em">
                <span style="text-transform:uppercase;font-weight:700">${input.label}</span>
                <input type="text" inputmode="numeric" class="maigh-input ${val?"has-value":""}" value="${val}" placeholder="${input.placeholder}" style="width:${input.width||60}px" onchange="updateMaighData('${item.id}','${input.key}',this.value.trim())">
              </label>`;
          }).join("");
          return `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px;background:${rowBg};border-radius:7px;border-left:4px solid ${rowBorder};opacity:${done?0.6:1}">
            <span class="tbox ${done?"checked":""}" title="${done?"Uncheck":"Mark received and prompt sheet update"}" onclick="toggleMaigh('${item.id}')" style="margin-top:2px;flex-shrink:0"></span>
            <div style="min-width:0;flex:1">
              <div style="font-size:12px;color:var(--text-2);font-weight:600;line-height:1.35;${done?"text-decoration:line-through":""}">${item.label}</div>
              ${item.note ? `<div style="font-size:10px;color:var(--text-5);margin-top:3px;line-height:1.4">${item.note}</div>` : ""}
              ${inputs ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${inputs}</div>` : ""}
            </div>

              <div style="font-size:9px;font-weight:800;color:${done?"#10B981":st.color};letter-spacing:.06em;white-space:nowrap">${done?"RECEIVED":st.label}</div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </details>
  </section>`;
}

function renderTeamAndBlockers(){
  const blockerLines = [...(LIVE?.blockers_detected || []), ...TASK_STATE.filter(t => t.status==="blocked").map(t => `${t.id} · ${t.name}`)];

  const load = name => {
    const tasks = TASK_STATE.filter(t => (t.owner||[]).includes(name));
    const done = tasks.filter(t => t.status==="complete"||t.status==="approved").length;
    const overdue = tasks.filter(t => isOverdue(t.due,t.status)).length;
    const deliverables = [...new Set(tasks.map(t => t.d))].sort();
    return {total: tasks.length, done, overdue, deliverables};
  };

  return `
  <section style="margin-top:24px;display:grid;grid-template-columns:1fr 1.5fr;gap:14px">
    <div>
      <h2 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FCA5A5;margin-bottom:10px;display:flex;align-items:center;gap:6px">${ICONS.octagonOff} Blockers</h2>
      <div style="background:var(--surface-1);border:1px solid var(--surface-3);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px">
        ${blockerLines.length ? blockerLines.map(b => `<div style="padding:8px 12px;background:var(--red-soft-bg);border-radius:6px;border-left:3px solid #EF4444;font-size:12px;color:#FCA5A5">${b}</div>`).join("") : `<div style="font-size:12px;color:var(--text-6);padding:8px 12px;text-align:center">No blockers</div>`}
      </div>
    </div>
    <div>
      <h2 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:6px">${ICONS.users} Team</h2>
      <div style="background:var(--surface-1);border:1px solid var(--surface-3);border-radius:10px;padding:6px">
        ${TEAM.map(t => {
          const l = load(t.n);
          const isWriter = t.n === "Mark Fredo" || t.n === "Jeffrey Hampton";
          const op = t.dim ? .5 : 1;
          return `
          <div style="display:grid;grid-template-columns:auto 1.4fr 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:6px;opacity:${op}">
            ${avatar(t.n, 32)}
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--text-2)">${t.n}${t.dim?" <span style='font-size:10px;color:#F59E0B;font-weight:700'>· LEAVE</span>":""}</div>
              <div style="font-size:10px;color:var(--text-5)">${t.r}</div>
            </div>
            <div style="font-size:11px;color:var(--text-4)">
              ${isWriter || !l.total ? `<span style="color:var(--surface-4)">— no assignments</span>` : l.deliverables.map(id => `<span onclick="jumpToTask('${id}')" title="Jump to ${id}" style="display:inline-block;cursor:pointer;color:var(--text-3);padding:2px 6px;margin-right:4px;background:var(--surface-3);border-radius:3px;font-weight:700;font-size:10px;letter-spacing:.06em">${id}</span>`).join("")}
            </div>
            <div style="text-align:right">
              ${l.total ? `<div style="font-size:12px;font-weight:700;color:var(--text-1)">${l.done}/${l.total}</div><div style="font-size:9px;color:${l.overdue?"#FCA5A5":"var(--text-5)"}">${l.overdue?l.overdue+" overdue":"on track"}</div>` : `<span style="font-size:10px;color:var(--surface-4)">—</span>`}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  </section>`;
}

function renderFooter(){
  return `
  <footer style="margin-top:32px;padding:18px 0 24px;border-top:1px solid var(--surface-3);text-align:center">
    <div style="font-size:11px;color:var(--text-6)">
      Data: <code style="color:var(--text-5)">assets/asset-tracker.md</code> seed + n8n aggregator overlay every 60s ·
      <a href="https://github.com/micpowl-dot/project-air-creative" style="color:var(--text-5);text-decoration:underline">repo</a>
    </div>
  </footer>`;
}

function render(){
  TODAY = new Date();
  LAST_RENDER = new Date();
  $("app").innerHTML = `
    ${renderHeader()}
    <main class="wrap" style="padding:8px 0 24px">
      ${renderStats()}
      ${renderMaighRequests()}
      ${renderGantt()}
      ${renderAttention()}
      ${renderDeliverables()}
      ${renderTeamAndBlockers()}
      ${renderFooter()}
    </main>
  `;
}

function tickRefreshLabel(){
  const el = document.getElementById("refresh-countdown");
  if (!el) return;
  const secs = Math.max(0, Math.ceil((NEXT_REFRESH - new Date()) / 1000));
  el.textContent = secs + "s";
  el.style.color = secs <= 5 ? "#34D399" : "var(--text-4)";
}

render();
fetchLive();
setInterval(fetchLive, 60000);
setInterval(tickRefreshLabel, 1000);
</script>
</body>
</html>
